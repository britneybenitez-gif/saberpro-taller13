spring.application.name=question-service
server.port=8083
spring.datasource.url=${DB_URL:jdbc:h2:mem:saberprodb;DB_CLOSE_DELAY=-1}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
app.repository=${APP_REPOSITORY:jpa}
app.validation.base-url=${VALIDATION_SERVICE_URL:http://localhost:8082}
app.validation.timeout=3s
app.messaging.review-queue=pregunta.revisar.queue
app.messaging.confirm-timeout=5s
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
management.endpoints.web.exposure.include=health,info
spring.jackson.mapper.allow-coercion-of-scalars=false
