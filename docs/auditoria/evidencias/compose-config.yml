name: saberpro-taller13
services:
  lifecycle-service:
    container_name: saberpro-lifecycle-service
    environment:
      DB_URL: jdbc:h2:file:/app/data/lifecycle;DB_CLOSE_ON_EXIT=FALSE
      SPRING_RABBITMQ_HOST: rabbitmq
    networks:
      saberpro-net: null
    volumes:
      - type: volume
        source: lifecycle-data
        target: /app/data
        volume: {}
    build:
      context: /home/victor_cespedes0710/proyectos/saberpro-taller13/lifecycle-service
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8084/actuator/health
      timeout: 5s
      interval: 5s
      retries: 20
      start_period: 30s
    ports:
      - mode: ingress
        target: 8084
        published: "8084"
        protocol: tcp
  question-service:
    container_name: saberpro-question-service
    environment:
      APP_REPOSITORY: jpa
      DB_URL: jdbc:h2:file:/app/data/questions;DB_CLOSE_ON_EXIT=FALSE
      SPRING_RABBITMQ_HOST: rabbitmq
      VALIDATION_SERVICE_URL: http://validation-service:8082
    networks:
      saberpro-net: null
    volumes:
      - type: volume
        source: question-data
        target: /app/data
        volume: {}
    build:
      context: /home/victor_cespedes0710/proyectos/saberpro-taller13/question-service
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
      validation-service:
        condition: service_healthy
        required: true
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8083/actuator/health
      timeout: 5s
      interval: 5s
      retries: 20
      start_period: 30s
    ports:
      - mode: ingress
        target: 8083
        published: "8083"
        protocol: tcp
  rabbitmq:
    container_name: saberpro-rabbitmq
    environment:
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_USER: guest
    hostname: rabbitmq
    image: rabbitmq:3-management
    networks:
      saberpro-net: null
    volumes:
      - type: volume
        source: rabbitmq-data
        target: /var/lib/rabbitmq
        volume: {}
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      timeout: 5s
      interval: 5s
      retries: 20
      start_period: 20s
    ports:
      - mode: ingress
        target: 5672
        published: "5672"
        protocol: tcp
      - mode: ingress
        target: 15672
        published: "15672"
        protocol: tcp
  validation-service:
    container_name: saberpro-validation-service
    networks:
      saberpro-net: null
    build:
      context: /home/victor_cespedes0710/proyectos/saberpro-taller13/validation-service
      dockerfile: Dockerfile
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8082/actuator/health
      timeout: 5s
      interval: 5s
      retries: 20
      start_period: 30s
    ports:
      - mode: ingress
        target: 8082
        published: "8082"
        protocol: tcp
networks:
  saberpro-net:
    name: saberpro-net
    driver: bridge
volumes:
  lifecycle-data:
    name: saberpro-taller13_lifecycle-data
  question-data:
    name: saberpro-taller13_question-data
  rabbitmq-data:
    name: saberpro-taller13_rabbitmq-data
